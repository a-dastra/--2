version: '3.8'

services:
  # 1. 后端 Python 服务
  backend:
    build: .
    container_name: backend
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}  
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
    depends_on:
      - redis
    networks:
      - app-network
    # 如果需要在宿主机直接调试，可以开放端口
    # ports:
    #   - "8080:8080"

  # 2. Redis 服务
  redis:
    image: redis:latest
    container_name: kebrain_redis
    networks:
      - app-network

  # 3. 前端 Nginx 服务
  frontend:
    image: nginx:latest
    container_name: frontend
    ports:
      - "80:80"
    volumes:
      - ./map:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
