        /* --- Switch Styles (Modified for Size & Position) --- */
        /* Scaled down by 20% (100px -> 80px) */
        .checkbox-wrapper-41 {

            top: 12px; /* Adjusted for visual balance */

            z-index: 100;
        }

        .checkbox-wrapper-41 input[type="checkbox"] {
            -webkit-appearance: none;
            width: var(--size);
            height: calc(var(--size) / 2);
            background-color: #fff;
            border: 3px solid #222;
            border-radius: 30px 100px 100px 100px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            outline: none;
            cursor: pointer;
            position: relative;
            transition: all 0.5s;

        .checkbox-wrapper-41 input[type="checkbox"]::before {
            content: "";
            position: absolute;
            width: calc(var(--size) / 2);
            height: calc(var(--size) / 2);
            left: 0;
            top: 50%;
            transform: translateY(-50%) scale(0.7);
            border: 3px solid #222;
            border-radius: 30px 100px 100px 100px;
            background-color: #fde881;
            box-sizing: border-box;

        }

        .checkbox-wrapper-41 input[type="checkbox"]:checked::before {

    <script>
        // ==========================================
        // GLOBAL STATE & UTILS
        // ==========================================
        const switchEl = document.getElementById('view-switch');
        const switchElMap = document.getElementById('view-switch-map');
        
        function setView(viewName) {
            document.body.setAttribute('data-view', viewName);
            switchEl.checked = (viewName === 'map');
            switchElMap.checked = (viewName === 'map');
            
            // If switching to map, trigger resize for AMap
            if (viewName === 'map' && window.mapInstance) {
                setTimeout(() => {
                    window.mapInstance.resize();
                }, 550); // Wait for transition
            }
        }

        // Event Listeners for Switching with delay after animation completes
        switchEl.addEventListener('change', (e) => {
            // Wait for animation to complete before switching views
            setTimeout(() => {
                if(e.target.checked) {
                    setView('map');
                } else {
                    setView('chat');
                }
            }, 500); // Match the transition duration
        });

        switchElMap.addEventListener('change', (e) => {
            // Wait for animation to complete before switching views
            setTimeout(() => {
                if(!e.target.checked) {
                    setView('chat');
                } else {
                    setView('map');
                }
            }, 500); // Match the transition duration
        });

        function makePanelResizable() {
            const panel = document.getElementById('log-panel');
            const handle = document.getElementById('resize-handle');
            let isResizing = false;
            let startY, startHeight;

            handle.addEventListener('mousedown', startResize);
            handle.addEventListener('touchstart', startResize, { passive: false });

            function startResize(e) {
                isResizing = true;
                e.preventDefault();
                const clientY = e.type === 'mousedown' ? e.clientY : e.touches[0].clientY;
                startY = clientY;
                startHeight = parseInt(document.defaultView.getComputedStyle(panel).height, 10);
                document.addEventListener('mousemove', resize);
                document.addEventListener('touchmove', resize, { passive: false });
                document.addEventListener('mouseup', stopResize);
                document.addEventListener('touchend', stopResize);
            }

            function resize(e) {
                if (!isResizing) return;
                e.preventDefault();
                const clientY = e.type === 'mousemove' ? e.clientY : e.touches[0].clientY;
                const dy = clientY - startY;
                let newHeight = startHeight - dy;
                const minHeight = 100;
                const maxHeight = window.innerHeight - 100;
                newHeight = Math.max(minHeight, Math.min(newHeight, maxHeight));
                panel.style.height = newHeight + 'px';
            }

            function stopResize(e) {
                isResizing = false;
                document.removeEventListener('mousemove', resize);
                document.removeEventListener('touchmove', resize);
                document.removeEventListener('mouseup', stopResize);
                document.removeEventListener('touchend', stopResize);
                const clientY = e.type === 'mouseup' ? e.clientY : (e.changedTouches ? e.changedTouches[0].clientY : null);
                if (clientY !== null && clientY > window.innerHeight - 50) {
                    panel.classList.remove('show');
                    window.currentMarkerId = null;
                }
            }
        }
